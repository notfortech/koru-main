name: Build & Optional Deploy API

on:
  push:
    branches:
      - main

  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual branch selection in GitHub UI

jobs:
  build-and-deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.inputs.branch || github.ref }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore StudioTechBI.Backend/StudioTechBI.API/StudioTechBI.API.csproj

    - name: Build
      run: dotnet build StudioTechBI.Backend/StudioTechBI.API/StudioTechBI.API.csproj --configuration Release --no-restore

    - name: Test
      # This workflow also runs on pull_request, so this is the actual PR gate -- runs the full
      # solution's test projects (restores/builds them independently of the API-only
      # restore/build above, which don't cover StudioTechBI.Infrastructure.Tests/
      # StudioTechBI.API.Tests). A failing test fails the PR check, not just a local run someone
      # has to remember to do by hand.
      run: dotnet test StudioTechBI.Backend/StudioTechBI.sln --configuration Release

    - name: Publish
      run: dotnet publish StudioTechBI.Backend/StudioTechBI.API/StudioTechBI.API.csproj -c Release -o publish

    - name: Deploy to Azure
      if: github.event_name == 'workflow_dispatch'
      uses: azure/webapps-deploy@v2
      with:
        app-name: studiotechbi-api
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: publish
