name: Deploy .NET API to Azure

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout correct branch
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Debug - list files
      run: ls -R

    - name: Restore
      run: |
        dotnet restore StudioTechBI.Backend/StudioTechBI.API/StudioTechBI.API.csproj || dotnet restore

    - name: Build
      run: |
        dotnet build StudioTechBI.Backend/StudioTechBI.API/StudioTechBI.API.csproj --configuration Release --no-restore || dotnet build --configuration Release --no-restore

    - name: Publish
      run: |
        dotnet publish StudioTechBI.Backend/StudioTechBI.API/StudioTechBI.API.csproj -c Release -o publish || dotnet publish --configuration Release -o publish

    - name: Deploy to Azure
      if: github.event_name == 'workflow_dispatch'
      uses: azure/webapps-deploy@v2
      with:
        app-name: studiotechbi-api
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: publish
