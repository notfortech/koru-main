name: Build and deploy ASP.Net Core app to Azure Web App - StudioTechbi-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore
        run: dotnet restore StudioTechBI.Backend/StudioTechBI.API

      - name: Build
        run: dotnet build StudioTechBI.Backend/StudioTechBI.API --configuration Release --no-restore

      - name: Publish
        run: dotnet publish StudioTechBI.Backend/StudioTechBI.API -c Release -o ${{ env.DOTNET_ROOT }}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ${{ env.DOTNET_ROOT }}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3C9D30F969E442DD99E62313BCCBF49C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2098907257A944019F43886E0E00A7F6 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_96D6A760B1CD437C95070AAF7E7598A1 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'StudioTechbi-api'
          slot-name: 'Production'
          package: .
